name: Deploy bull-oilfield subdomain

on:
  push:
    branches: [main]
    paths:
      - "bull-oilfield/**"
      - ".github/workflows/deploy-bull-oilfield.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Deploy bull-oilfield to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy bull-oilfield --project-name=bull-oilfield --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
